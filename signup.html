<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓 회원가입페이지</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/auth.js" defer></script>
    <script src="js/password.js" defer></script>
</head>
<body>
    <div class="signup_box">
        <div class="signup_logo_box">
            <a href="/index.html" class="signup_logo"></a>
        </div>
            <form class="login-form">
                <label for="email">이메일</label>
                <input id="email" type="email" name="email" placeholder="이메일을 입력해주세요.">
                <label for="username">닉네임</label>
                <input id="username" type="username" name="username" placeholder="닉네임을 입력해주세요.">
                <label for="password">비밀번호</label>
                <div class="password-wrapper-second">
                    <input id="password" type="password" name="password" placeholder="비밀번호를 입력해주세요." required>
                    <img src="images/icon_eye_off.png" class="toggle-password" alt="눈이 꺼진 아이콘">
                </div>
                <label for="password-check">비밀번호 확인</label>
                <div class="password-wrapper-second">
                    <input id="password-check" type="password" name="password" placeholder="비밀번호를 다시 한 번 입력해주세요." required>
                    <img src="images/icon_eye_off.png" class="toggle-password-second" alt="눈이 꺼진 아이콘">
                </div>
                <button class="signup-button">회원가입</button>
                    <!-- 간편로그인 -->
                    <div class="social-login">
                        <p>간편 로그인하기</p>
                        <div class="social-button">
                        <button class="social-btn google-btn">
                            <img src="images/google_login.png" alt="구글 로고" />
                        </button>
                            <button class="social-btn kakao-btn">
                            <img src="images/kakao_login.png" alt="카카오 로고" />
                        </button>
                        </div>
                    </div>
                    <!-- //간편로그인 -->
                <div class="signup_button_txt">
                    <span>이미 회원이신가요?</span><a href="/login.html">로그인</a>
                </div>
            </form>
    </div>
</body>
</html>
