<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>판다마켓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- 헤더 -->
    <div class="header">
      <div class="header_box">
        <a href="/index.html" alt="판다마켓 로고" class="h_logo"></a>
        <a href="/index.html" alt="판다마켓 로고" class="mb_logo"></a>
          <a href="/login.html" class="login"><span>로그인</span></a>
        </div>
    </div>
    <!-- 메인 -->
    <section class="main">
      <div class="hero">
          <div class="hero_content">
          <div class="hero_text">
            <span class="hero_title">일상의 모든 물건을 <br>거래해 보세요</span>
            <a href="/items.html"><span class="hero_button">구경하러 가기</span></a>
          </div>
          <img src="images/Img_visual.png" alt="상단배너이미지" class="hero_image">
          </div>
        </div>
      </section>
      <!-- 3개 배너공간 -->
       <div class="feature-list">
        <div class="feature feature-hot-item">
          <div class="feature_content">
            <img src="images/Img_hot_item.png" alt="판다두명이옷을보고있는이미지" class="feature_image">
            <div class="feature_text">
              <p class="feature_label">Hot Item</p>
              <span class="feature_title">인기상품을<br>확인해보세요</span>
              <span class="feature_description">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</span>
            </div>
          </div>
        </div>
        <div class="feature feature-search">
          <div class="feature_content">
            <div class="feature_text feature_text-left">
              <p class="feature_label">Search</p>
              <span class="feature_title">구매를 원하는<br>상품을 검색하세요</span>
              <span class="feature_description">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</span>
            </div>
            <img src="images/Img_search.png" alt="돋보기이미지" class="feature_image">
          </div>
        </div>
        <div class="feature feature-register">
          <div class="feature_content">
            <img src="images/Img_register.png" alt="아이콘이여러개있는이미지" class="feature_image">
            <div class="feature_text">
              <p class="feature_label">Register</p>
              <span class="feature_title">판매를 원하는<br>상품을 등록하세요</span>
              <span class="feature_description">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</span>
            </div>
          </div>
        </div>
      </div>
      <!-- 3개배너 밑 여백 -->
    <div class="blank"></div>
    <!-- 하단배너 -->
    <div class="promo-banner">
      <div class="promo-banner_content">
        <div class="promo-banner_text">
         <span class="promo-banner_title">믿을 수 있는<br>판다마켓 중고 거래</span>
        </div>
        <img src="images/Img_conversation_panda.png" alt="판다캐릭터가대화하고있는이미지" class="promo-banner_image">
      </div>
    </div>
    <!-- footer -->
    <div class="footer">
      <div class="footer_content">
        <div class="copy" id="copyright"><span>ⓒcodeit - 2024</span></div>
        <div class="footer_menu">
          <a href="/Privacy.html"><span>Privacy Policy</span></a>
          <a href="/qna.html"><span>FAQ</span></a>
        </div>
        <div class="sns">
          <a href="http://facebook.com/"><img src="images/ic_facebook.png" alt="facebook"></a>
          <a href="https://x.com/?lang=ko/"> <img src="images/ic_twitter.png" alt="twitter"></a>
          <a href="https://youtube.com/"><img src="images/ic_youtube.png" alt="youtube"></a>
          <a href="https://www.instagram.com/"><img src="images/ic_instagram.png" alt="instagram"></a>
        </div>
      </div>
    </div>
  </body>
</html>
