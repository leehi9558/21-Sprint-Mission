<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>판다마켓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="header">
      <div class="header_box">
        <a href="/" alt="판다마켓 로고" class="h_logo"></a>
        <!-- <div class="login"> -->
          <a href="/login.html" class="login"><span>로그인</span></a>
        </div>
      <!-- </div> -->
    </div>
    <div class="main">
      <div class="visual">
          <div class="visual_txtimg">
          <div class="visual_text">
            <span>일상의 모든 물건을<br>거래해 보세요</span>
            <a href="/items"><span>구경하러 가기</span></a>
          </div>
          <img src="images/Img_home_top.png" alt="visual이미지" class="visual_img">
          
        </div>
      </div>
      <!-- 3개 배너공간 -->
       <div class="image_text_bigbox">
        <div class="image_text_box">
          <div class="banner3_imgtxt">
            <img src="images/Img_home_01.png" alt="인기상품이미지" class="banner3_img">
            <div class="banner3_txtbox">
              <p class="banner3_tit">Hot Item</p>
              <span class="banner3_txt">인기상품을<br>확인해보세요</span>
              <span class="banner3_btxt">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</span>
            </div>
          </div>
        </div>
        <div class="image_text_box">
          <div class="banner3_imgtxt">
            <div class="banner3_txtbox banner3_img2">
              <p class="banner3_tit">Search</p>
              <span class="banner3_txt">구매를 원하는<br>상품을 검색하세요</span>
              <span class="banner3_btxt">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</span>
            </div>
            <img src="images/Img_home_02.png" alt="찾는상품이미지" class="banner3_img">
          </div>
        </div>
        <!-- 이 태그 밑에 138px 여유주기 -->
        <div class="image_text_box">
          <div class="banner3_imgtxt">
            <img src="images/Img_home_03.png" alt="판매상품이미지" class="banner3_img">
            <div class="banner3_txtbox">
              <p class="banner3_tit">Register</p>
              <span class="banner3_txt">판매를 원하는<br>상품을 등록하세요</span>
              <span class="banner3_btxt">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="margin138"></div>
    <div class="banner">
      <div class="f_banner_box">
        <div>
         <span>믿을 수 있는<br>판다마켓 중고 거래</span>
        </div>
        <img src="images/Img_home_bottom.png" alt="하단배너이미지">
      </div>
    </div>
    <div class="footer">
      <div class="footer_box">
        <div class="copy"><span>ⓒcodeit - 2024</span></div>
        <div class="footer_menu">
          <a href="/"><span>Privacy Policy</span></a>
          <a href="/"><span>FAQ</span></a>
        </div>
        <div class="sns">
          <img src="images/Frame 2609406.png" alt="sns">
        </div>
      </div>
    </div>
  </body>
</html>
